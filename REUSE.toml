# Who may use which file, and under what (REUSE: https://reuse.software/spec-3.3/#reusetoml), by path; later annotations win
# where they overlap. Decision 2026-11-19-licences-for-our-repositories (linux-phone-oco/docs), modelled on device-template #33:
# our data, docs and research are CC-BY-SA-4.0 (LICENSE), our scripts and code MIT OR Apache-2.0 (LICENSE-MIT, LICENSE-APACHE),
# our own device trees GPL-2.0-only OR BSD-2-Clause (SPDX header in each), and the board file derived from the GPL wahoo
# files stays GPL-2.0-only, its Copyright lines untouched. bin/licence-check (make verify, CI) is ideal-agent's script,
# copied as it is; it reads one `path = [...]` per line, and `*` for it crosses folders. Third-party material keeps its own
# licence and is not here: the LineageOS images in control/ are not in git, nor is firmware; porthole's pmaports pieces and
# kernel patches based on upstream files carry the licence of the file they change, in their own SPDX header.
version = 1

# The scripts and configuration.
[[annotations]]
path = [".gitattributes", ".github/**", "bin/**", "queries/**", "records/**", "build/**", "tests/**", "procedures/**", "tools/**", "rootfs/**", "provision/**", "tables.toml", "kernel/topics.toml", "Makefile", "devicebase.toml", "idealkb.toml", "oco.toml", ".gitignore", ".oco/**", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 grenudi"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The data, the docs and the research (what the phone said, as it said it), where they overlap the paths above they win.
[[annotations]]
path = ["LICENSE", "README.md", "**/README.md", "AGENTS.md", "data/**", "docs/**", "research/**", "tests/results/**", "tests/health/README.md", "device.toml", "build/fdt-bisect-xa-left.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 grenudi"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The research folder's own scripts are code.
[[annotations]]
path = ["research/**/*.sh"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 grenudi"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The board file derived from the GPL wahoo files (Caleb Connolly, Jami Kettunen, The Linux Foundation): their licence.
[[annotations]]
path = ["dt/msm8998-google-walleye.dts"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 Caleb Connolly, 2021 Jami Kettunen, 2016 The Linux Foundation, 2026 grenudi"
SPDX-License-Identifier = "GPL-2.0-only"

# Our own device trees (variants that include the board file, and the generated stubs).
[[annotations]]
path = ["dt/msm8998-google-walleye-f.dts", "dt/msm8998-google-walleye-ufs.dts", "dt/msm8998-google-walleye-overlay-stubs.dtsi"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 grenudi"
SPDX-License-Identifier = "GPL-2.0-only OR BSD-2-Clause"

[[annotations]]
path = ["kernel/fuel-gauge-rfc/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 grenudi"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["kernel/drv2624/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 grenudi"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The ADSP/q6 series (item walleye-adsp-q6-mi2s): patches of kernel files carry the kernel's licence (porthole's, as named in each patch; 0009 ours on theirs); the record is ours.
[[annotations]]
path = ["kernel/audio-adsp-q6/0009-*.patch", "kernel/audio-adsp-q6/SHA256SUMS"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2021-2026 the authors named in each patch (Giuseppe Maggio, Jami Kettunen, AngeloGioacchino Del Regno, Casey Connolly), grenudi"
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = ["kernel/audio-adsp-q6/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 grenudi"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The MDSS reset record (item walleye-display-dts-any-order): ours.
[[annotations]]
path = ["kernel/display-mdss-reset/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 grenudi"
SPDX-License-Identifier = "CC-BY-SA-4.0"
