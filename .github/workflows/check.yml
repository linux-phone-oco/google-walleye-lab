name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax and shellcheck (errors)
        run: |
          set -e
          git ls-files -z '*.sh' | xargs -0 -r -n1 sh -n
          git ls-files -z '*.sh' | xargs -0 -r shellcheck -S error -s sh
          echo "checked: $(git ls-files '*.sh' | wc -l) scripts"
  overlay-collisions:
    name: overlay-collisions test proves itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq device-tree-compiler xxd
      - name: the collision test finds a collision, passes a clean pair, honours its allow list
        run: sh tests/host/overlay-collisions-selftest.sh
  ufs-off-gate:
    name: ufs-off gate proves itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq device-tree-compiler xxd mkbootimg
      - name: the gate fails a dtb or image with UFS on, with no status, or enabled by the overlay, and passes UFS off (decision 2026-11-19-walleye-ufs-off-by-a-gate)
        run: sh tests/host/ufs-off-image-selftest.sh
  bootchain-readback:
    name: boot-chain read-back proves itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the check fails on an empty, short, wrong-hash, wrong-mode or differing read-back and passes a complete one twice; the reader refuses without adb device, battery or a clean DIR (no phone)
        run: sh tests/host/bootchain-readback-selftest.sh
  fuel-gauge:
    name: the fuel gauge check proves itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the check fails a phone with no qcom-battery supply on the text two phones printed, and skips what cannot be read (no phone; the typed cases run in the host checks job)
        run: sh tests/host/fuel-gauge-selftest.sh
  image-recipe:
    name: the image recipe check proves itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the check passes a declared recipe the program finds or would build, fails a missing recipe table, a refusal or an unknown line, and skips without the program (stand-ins, no store, no phone)
        run: sh tests/host/image-recipe-selftest.sh
      - name: the header check passes a header equal to the recipe and fails a word more or less, also in the additional field (stand-ins, no store)
        run: sh tests/host/image-header-equals-recipe-selftest.sh
  cmdline-budget:
    name: every recipe's command line stays within the header budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the check proves itself (an over-long recipe, a bootable or stale or reasonless exception fail), clippy clean, then reads device.toml
        run: |
          cd tools/walleye-cmdline-budget
          cargo test --locked
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo run --locked -q -- --device ../../device.toml --exceptions ../../tests/host/cmdline-over-budget.toml
  kernel-config:
    name: every kernel fragment keeps the protection domain mapper built in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the check passes this repository's fragments and fails each way they can lose CONFIG_QCOM_PD_MAPPER=y, QRTR included (no kernel tree, no phone)
        run: sh tests/host/kernel-pd-mapper-selftest.sh
      - name: the check for the sensor hub's PAS driver passes this repository's fragments and fails each way they can lose it (no kernel tree, no phone)
        run: sh tests/host/kernel-slpi-pas-selftest.sh
      - name: the fragments set it (the merged .config is read back on the lab host, tests/host/kernel-pd-mapper.sh KERNEL_TREE)
        run: |
          out=$(sh tests/host/kernel-pd-mapper.sh || true); echo "$out"
          case "$out" in "skip walleye-kernel-pd-mapper host the fragments set it"*|pass*) ;; *) exit 1 ;; esac
  checks-have-sources:
    name: every host script names its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the gate proves itself on small trees, then refuses a script with no source, a source that does not exist, and a row for a gone script (tests/host/SOURCES.toml)
        run: |
          cd tools/walleye-sources
          cargo test --locked
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo run --locked -q -- --root ../..
          cargo run --locked -q -- --root ../.. --dir tests/fixtures/phone-text --table tests/fixtures/phone-text/SOURCES.toml --ext cap
          cargo run --locked -q -- --root ../.. --procedures procedures
      - name: the host checks pass the text a phone printed and fail each fault in it (tests/fixtures/phone-text)
        run: |
          sh tests/host/banner-selftest.sh
          sh tests/host/banner-loop-selftest.sh
          sh tests/host/banner-shell-selftest.sh
          sh tests/host/dmesg-clean-selftest.sh
          sh tests/host/pmic-dmesg-selftest.sh
          sh tests/host/pmic-dmesg-typed-selftest.sh
          sh tests/host/charger-selftest.sh
          sh tests/host/charger-typed-selftest.sh
          sh tests/host/fuel-gauge-typed-selftest.sh
          sh tests/host/phone-state-selftest.sh
  licence-coverage:
    name: every tracked file is covered by a licence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bin/licence-check (decision 2026-11-19-licences-for-our-repositories)
        run: sh bin/licence-check
  attended-tries:
    name: the attended tries prove themselves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the try's plumbing against a stand-in phone, clippy clean (no phone)
        run: |
          cd tools/walleye-tries
          cargo test --locked
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: every procedure walks its steps in a dry run (lpoco-attended check)
        run: |
          cargo install --locked rust-script
          # the library's boot_once asks `lpoco-bringup image ensure --dry-run` for an image not on disk (CI has none)
          export LPOCO_BRINGUP_DEST="$RUNNER_TEMP/bringup"
          prog=$(bin/install-bringup.sh)
          ln -sf "$prog" "$LPOCO_BRINGUP_DEST/lpoco-bringup"
          PATH="$LPOCO_BRINGUP_DEST:$PATH" bin/attended check
      - name: no procedure, script or brief calls a bare lpoco-attended; bin/attended runs the one the steps crate is locked to
        run: sh tests/host/no-bare-lpoco-attended.sh
      - name: the stripe drawer (frame, struct sizes), clippy clean (no phone)
        run: |
          cd tools/walleye-stripes
          cargo test --locked
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: the reboot-with-a-command tool (the string given is the string passed to reboot(2)), clippy clean (no phone)
        run: |
          cd tools/walleye-reboot
          cargo test --locked
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: the Alpine rootfs tool (what the image may hold), clippy clean (no phone)
        run: |
          cd tools/walleye-rootfs
          cargo test --locked
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: the Alpine-in-RAM image tool (what the ramdisk may hold), clippy clean (no phone)
        run: |
          cd tools/walleye-ramroot
          cargo test --locked
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
  device-toml:
    name: device.toml is read by its pinned lpoco-lab and the newest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the script's own proof against a stand-in release, then the real check: the release pinned on the first line, and the newest
      - run: sh tests/ci/check-device-toml.sh
      - run: sh bin/check-device-toml.sh
        env:
          GH_TOKEN: ${{ github.token }}
