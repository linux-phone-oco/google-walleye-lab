# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "walleye-stripes"
version = "0.1.0"
edition = "2021"
description = "The stripe drawer of image L6: four vertical stripes on the framebuffer of the display, held for some seconds, with the connector read back"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "walleye_stripes"

[[bin]]
name = "walleye-stripes"
path = "src/main.rs"

[dependencies]
# the command line is declared once (argenv), not parsed by hand
argenv-resolve = "0.4"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
