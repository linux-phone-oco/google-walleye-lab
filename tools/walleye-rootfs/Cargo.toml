# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "walleye-rootfs"
version = "0.1.0"
edition = "2021"
description = "The Pixel 2's Alpine rootfs (the hardware-test layer): built rootless with apk.static, imaged with mke2fs -d, checked by what is in the image"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "walleye_rootfs"

[[bin]]
name = "walleye-rootfs"
path = "src/main.rs"

[dependencies]
# the command line is declared once (argenv), not parsed by hand
argenv-resolve = "0.4"
