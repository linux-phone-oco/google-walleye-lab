# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "walleye-sources"
version = "0.1.0"
edition = "2021"
description = "The gate that every check of this lab names its source: a table of script to research row, source row, or file, refused when a script has none or a source does not exist"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "walleye_sources"

[[bin]]
name = "walleye-sources"
path = "src/main.rs"

[dependencies]
# the command line is declared once (argenv), not parsed by hand
argenv-resolve = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
