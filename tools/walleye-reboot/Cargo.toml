# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "walleye-reboot"
version = "0.1.0"
edition = "2021"
description = "Reboot the phone with a command string through reboot(2) RESTART2 (busybox reboot drops the argument, so the bootloader never hears 'bootloader')"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "walleye_reboot"

[[bin]]
name = "walleye-reboot"
path = "src/main.rs"

[dependencies]
# the command line is declared once (argenv), not parsed by hand
argenv-resolve = "0.4"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
