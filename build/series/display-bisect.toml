# d0, d1, d2 (backlog walleye-display-bisect-images): z21's boot.img (shell comes up) with the display kernel, then the display dtb in stages; d3 = images-display/boot-display.img (no shell, tried).
# The parts are build/build-display-bisect-dtbs.sh (retired 2026-11-26, batch 3; in git history). Run: lpoco-bringup image bisect build/series/display-bisect.toml --out OUT; every image passes tests/host/ufs-off-image.sh (its check script build/check-display-*.sh is retired too).
control = "../../../../walleye-build/images-z21/boot-z21.img"

[[image]]   # the display kernel (DRM, DPU, DSI, panel driver built in) with z21's dtb unchanged
name = "d0"
kernel = "../../../../walleye-build/images-display-bisect/Image.gz"

[[image]]   # + the display dtb with mdss and the display controller only
name = "d1"
kernel = "../../../../walleye-build/images-display-bisect/Image.gz"
dtb = "../../../../walleye-build/images-display-bisect/d1.dtb"

[[image]]   # + the DSI host and its PHY, panel node absent
name = "d2"
kernel = "../../../../walleye-build/images-display-bisect/Image.gz"
dtb = "../../../../walleye-build/images-display-bisect/d2.dtb"
