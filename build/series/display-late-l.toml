# L1, L2 (backlog walleye-display-late-probe-l-images; decision 2026-11-19-walleye-display-iommu-reading): the late-probe image (display drivers as modules, netconsole, init-late, the full display dtb) with the iommu fix of g1 and g2.
# l2.dtb is build/build-display-late-l-dtb.sh (retired 2026-11-26, batch 3; in git history). Run: lpoco-bringup image bisect build/series/display-late-l.toml --out OUT; every image passes tests/host/ufs-off-image.sh (its check script build/check-display-*.sh is retired too).
control = "../../../../walleye-build/images-display-late/boot-display-late.img"

[[image]]   # the late-probe image with iommu.passthrough=1 on the command line
name = "l1"
cmdline = 'clk_ignore_unused ignore_loglevel panic=5 androidboot.hardware=walleye androidboot.console=ttyMSM0 androidboot.dtbo_idx=3 dyndbg="file drivers/gpio/gpiolib.c +p; file drivers/gpio/gpiolib-of.c +p; file drivers/pinctrl/core.c +p; file drivers/pinctrl/devicetree.c +p; file drivers/pinctrl/qcom/pinctrl-spmi-gpio.c +p" iommu.passthrough=1'

[[image]]   # the late-probe image without the iommus property of the mdss node
name = "l2"
dtb = "../../../../walleye-build/images-display-late-l/l2.dtb"
