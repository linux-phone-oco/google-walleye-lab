# wp1..wp5, wpa (backlog walleye-property-bisect): wa plus one group of pk2's property differences each; wpa is all five. The dtbs are the recorded ones: build-property-bisect.sh (retired 2026-11-26, batch 2; in git history) makes them.
# Run: lpoco-bringup image bisect build/series/property-bisect.toml --out OUT; the images' sha256 are the SHA256SUMS of walleye-build/images-wp.
control = "../../../../walleye-build/images-w/boot-wa.img"

[[image]]
name = "wp1"
dtb = "../../../../walleye-build/images-wp/wp1.dtb"

[[image]]
name = "wp2"
dtb = "../../../../walleye-build/images-wp/wp2.dtb"

[[image]]
name = "wp3"
dtb = "../../../../walleye-build/images-wp/wp3.dtb"

[[image]]
name = "wp4"
dtb = "../../../../walleye-build/images-wp/wp4.dtb"

[[image]]
name = "wp5"
dtb = "../../../../walleye-build/images-wp/wp5.dtb"

[[image]]
name = "wpa"
dtb = "../../../../walleye-build/images-wp/wpa.dtb"
