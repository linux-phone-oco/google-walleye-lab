# w1..w5, wr, wa (backlog walleye-overlay-enables-what): pk5 (our kernel + porthole's taimen dtb, alive) made walleye-like group by group; wa is cumulative. The dtbs are the recorded ones: build/build-taimen-walleye.sh makes them.
# Run: lpoco-bringup image bisect build/series/taimen-walleye.toml --out OUT; the images' sha256 are the SHA256SUMS of walleye-build/images-w.
control = "../../../../walleye-build/images-pk456/boot-pk5.img"

[[image]]
name = "w1"
dtb = "../../../../walleye-build/images-w/w1.dtb"

[[image]]
name = "w2"
dtb = "../../../../walleye-build/images-w/w2.dtb"

[[image]]
name = "w3"
dtb = "../../../../walleye-build/images-w/w3.dtb"

[[image]]
name = "w4"
dtb = "../../../../walleye-build/images-w/w4.dtb"

[[image]]
name = "w5"
dtb = "../../../../walleye-build/images-w/w5.dtb"

[[image]]
name = "wr"
dtb = "../../../../walleye-build/images-w/wr.dtb"

[[image]]
name = "wa"
dtb = "../../../../walleye-build/images-w/wa.dtb"
