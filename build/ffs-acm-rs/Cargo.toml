[package]
name = "ffs-acm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A serial console for the walleye phone through FunctionFS (one class-2 interface, a pty shell bridged to the bulk endpoints)"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
