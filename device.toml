# The read-only UFS-on boot of that image as ONE command (item walleye-install-boot-procedure; run by item walleye-install-rootfs-boots-try). The root is the system partition of the slot Android is NOT on, read at the run
# (adb's ro.boot.slot_suffix equal to fastboot's current-slot, and equal to the root the image names); nothing here names a slot.
# The image booted is THIS run's: the declared one with androidboot.slot_suffix=_<the slot read> on its command line (lpoco-bringup image swap, checked equal in every other byte); the declared sha256 above stays the one the go names.
[procedures.rootfs-boots-on-the-pixel-2]
go_item = "walleye-install-rootfs-boots-try"   # the item whose go_until holds the author's go AND whose row names the image's sha256: the boot runs only while the go is in the future
identity = "~/lab-material/walleye/walleye-lab-ed25519"   # the lab-only ssh key (mode 600; its public half is root's authorized_keys in [images.alpine-rootfs]); the login is by this key alone
ssh_user = "root"
ssh_port = 22
bootchain = "~/lab-material/walleye/bootchain-2026-11-19"   # the stored boot chain read-back: the boot chain read again after the boot must equal it (tests/host/bootchain-readback-check.sh STORED NEW)
by_name = "/dev/block/by-name"                              # the phone's partition names on Android: the root partition is hashed by name before and after
luns = 6                                                    # the card's disks (sda to sdf): the partition table of each is hashed before and after
fixtures = "tests/fixtures/phone-text"                      # the folder (in this lab) the capture step writes our kernel's text into: fixtures with the image sha256, the command and the date above the text

# The rehearsal of that boot (procedures/rehearse-rootfs-boots-on-the-pixel-2.rs; item walleye-rootfs-boots-rehearsal): every step but the boot, the card read from Android, the guard, the slots' flags, the boot chain read back.
# It boots nothing and needs no go (go_item is read into the settings and never asked); the keys are the boot's, read from this table, so a key renamed there fails in both.
[procedures.rehearse-rootfs-boots-on-the-pixel-2]
go_item = "walleye-install-rootfs-boots-try"
identity = "~/lab-material/walleye/walleye-lab-ed25519"
ssh_user = "root"
ssh_port = 22
bootchain = "~/lab-material/walleye/bootchain-2026-11-19"
by_name = "/dev/block/by-name"
luns = 6
fixtures = "tests/fixtures/phone-text"

