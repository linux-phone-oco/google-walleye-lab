sha256 = "83b9c4c644ffb8de03f5b5f1d6eaf8c6fa72ea7121699d0cab1cf2a53034f981"   # rebuilt 2026-11-23 on rootfs v5 (dmesg -n 3 before the respawn); was ad91dcd7 on v4

