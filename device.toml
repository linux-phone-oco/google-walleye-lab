# The Alpine login prompt on the glass (item walleye-display-alpine-ramroot-image; procedures/alpine-login-on-the-glass-on-the-pixel-2.rs): image B-a5, B-r5's kernel, dtb and 13 display modules with the
# Alpine userland unpacked into a tmpfs root (UFS off), booted once from memory; ssh over usb-network by the lab key; then the author's look. Run unattended by the keeper it stops at the look; the way back runs after.
[procedures.alpine-login-on-the-glass-on-the-pixel-2]
image = "b-a5"                  # the name of its [images.NAME] (path, sha256)
