# Install stage 1 (item walleye-install-write-procedure; decision 2026-11-20-walleye-install-stage-1-go): the Alpine image [images.alpine-rootfs] written from Android to the
# system partition of the slot Android is NOT on. The slot is read at the run (fastboot getvar current-slot, equal to adb's ro.boot.slot_suffix), never typed here.
[procedures.install-rootfs-on-the-pixel-2]
backup = "~/lab-material/walleye/slot-readback-2026-11-20-2"   # the slots' read-back (the way back): tests/host/slot-readback-check.sh must pass on it, and the target partition read fresh must equal its sha256
