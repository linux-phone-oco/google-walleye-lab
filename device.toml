#:schema https://raw.githubusercontent.com/linux-phone-oco/lab-tools/lpoco-lab-v0.53.5/manifest/device.schema.json
# ^ the lpoco-lab release this file follows: editors complete and check from its schema, CI reads the file with that release.
# This phone's manifest - the only file a new phone's lab needs to say. Every tool reads it:
# lpoco lab (linux-phone-oco/lab-tools) finds it like cargo finds Cargo.toml, or by --device.
# Secrets and what is learned at run time stay outside the repository:
#   ~/.config/devlab/CODENAME/   the phone user's password (mode 600), Wi-Fi name and password
#   ~/.local/state/devlab/CODENAME/   the Wi-Fi address once learned, results kept by the lab
# Replace every value marked CHANGE; delete what does not apply. Unknown fields are refused.

[device]
codename = "google-walleye"        # the Pixel 2; fastboot serial FA81N1A00790; until Linux runs it speaks only fastboot

[connection]
user = "user"                      # the phone's user
addresses = ["172.16.43.1"]   # walleye's own USB-networking address: surya answers on 172.16.42.1 on the same host
shell_address = "172.16.43.1"      # the shell's address as dev() reads it (a list cannot be read): the same as addresses[0]
shell_port = 23
transport = "telnet"               # our test images answer over telnet on the USB-networking address; an Android boot would be "adb" (lab-tools 0.38.0)
login = "none"                     # no password exists on walleye: lpoco lab suite says "not applicable" (decision walleye-declare-transport-login)

# Stock Android, reached over adb. user = "root": the library (lab-tools 0.53.5) runs `adb root` and waits for the device once per Phone, so its steps run as root
# with no su (decisions 2026-11-26-walleye-android-connection-user-root, 2026-11-26-walleye-adb-root-is-the-librarys). walleye's own `adb root` stays only where its own adb calls come before any library call.
[connections.android]
addresses = []                     # adb needs no address (lab-tools: addresses = [] is fine over adb)
transport = "adb"
user = "root"

[provision]
packages = "provision/packages.txt"   # installed on a freshly flashed phone: lpoco lab provision now

[fastboot]
# every fastboot call lpoco lab makes names this serial; writes stays false until a recorded decision says otherwise
# (decision walleye-fastboot-first): lpoco lab fastboot boot now BOOT.IMG boots from memory without writing.
serial = "FA81N1A00790"
writes = false
slot_switch = true                 # set-active only, metadata: decision walleye-slot-flags-tries-on-b

[flash]
# How an image goes onto this phone (lpoco lab flash now IMAGE BOOTLOADER). The defaults suit an A-only
# phone flashed over fastboot with the image on userdata; say what differs.
sector_size = 4096                 # UFS
dtb = ""                           # not known yet: walleye boots only by fastboot boot for now; A/B slots untouched until a recorded decision
mask = []                          # services masked in the image - each with its reason beside it
enable = ["sshd.service"]          # the image disables sshd by preset; the lab must reach the phone

# What the phone's own health suite expects of it (lpoco lab suite put now). The phone checks itself 120 s
# after every boot; every change lpoco lab makes ends with that report. Say only facts about the hardware.
[health]
battery_floor_mv = 3700            # no try starts below this battery voltage (tests/host/battery-ok.sh and the attended programs)
battery_source = "fastboot-getvar" # how it is read; battery-ok.sh reads adb dumpsys first while Android runs, the same voltage
sound_cards = []                   # names as /proc/asound/cards shows them, e.g. ["POCO X3"]
checks = "tests/health"            # this phone's own checks, beside the generic ones
absent = ["jack"]                   # the Pixel 2 has no headphone jack; the rest is not measured yet
                                   #   camera, jack, display, touchscreen, haptics, sensors, usb-otg
gaps = []                          # components never working yet (docs component ids): measured, not ill health
known_failed_units = []            # units known to fail here, each with its reason beside it
known_warnings = []                # boot warnings (file:line) known here, each with its reason

[health.remoteprocs]               # signal processors that must run, and the component resting on each
# adsp = "audio-speaker"
# modem = "modem-data"

# walleye is a fastboot-first phone (decision 2026-11-17-walleye-fastboot-first): while no Linux runs on it, lpoco lab reaches it
# only over fastboot (`fastboot boot` of a kernel held in memory, nothing written); both A/B slots stay as they are
# until a recorded decision says otherwise. Its lease is its own, never surya's.

# What the lab host needs to read this phone's gadget (declared 2026-11-17 for the lab-prepare tool, whose first use is
# its acceptance test): our gadget's USB serial, the kinds of device nodes the lab user must be able to open, and the
# host modules the gadget functions need. Nothing here is read by lpoco lab itself; the shape is the tool's to settle.
[host]
modules = ["usb_storage", "cdc_acm"]

[[host.gadget]]
serial = "walleye-first-boot"
access = ["block", "tty"]          # /dev/sdX (mass_storage window m1) and /dev/ttyACM*
usb_id = "1d6b:0104"                # Linux Foundation multifunction composite, what our init sets (idVendor/idProduct)

# The device layer, declared once (decision 2026-11-19-device-layer-declared-once): each package format is generated
# from it. Checked against lab-tools' manifest/device.schema.json by `lpoco-manifest check`. Facts only: no
# proprietary blob, serial or address is in it - the firmware is the phone's own, read from its partitions.
[layer]
name = "google-walleye"            # the packages' stem: google-walleye-config, google-walleye-boot, linux-google-walleye
needs = []                         # none yet: no userland of ours runs on walleye (it has only the bring-up init); not invented

[layer.kernel]
tree = "https://github.com/linux-phone-oco/linux"
tag = "topic/pmic-wdt-wake-in-suspend"   # kernel.org v7.3 plus this topic (our dts needs its &pm8998_wdt); a branch until a release is tagged
config = "build/walleye.config"          # over the arm64 defconfig; build/build-kernel.sh merges it
dtbs = ["qcom/msm8998-google-walleye.dtb"]   # from dt/msm8998-google-walleye.dts (UFS off, by decision 2026-11-19-walleye-ufs-off-by-a-gate)

[layer.boot]
method = "android-bootimg"         # an Android boot.img rewritten per kernel, the addresses from [boot] below; AVB footer, algorithm NONE

[layer.firmware]
# The Pixel 2's own firmware is read from its vendor partitions (modem, adsp, slpi, venus, wifi), never packaged and
# never put in a repository: they are named here as sources only. Nothing reads them yet (walleye-wifi-wcn3990 will).
method = "extract-from-partitions"

# No UCM files and no udev files yet: walleye has no sound card and no udev userland of ours. Not invented.

# The boot glue for [layer.boot]: header v0 as the recorded boot images carry it (z21; its diagnostic dyndbg words left out of the cmdline).
[boot]
header_version = 0
base = 0x0
kernel_offset = 0x8000
ramdisk_offset = 0x1000000
second_offset = 0x0
tags_offset = 0x100
pagesize = 4096
os_version = "15.0.0"
os_patch_level = "2026-11"
cmdline = "clk_ignore_unused ignore_loglevel panic=5 androidboot.hardware=walleye androidboot.console=ttyMSM0 androidboot.dtbo_idx=3"
partition_size = 33554432          # the boot partition, 32 MiB: an image with its AVB footer must fit
msm_id = [0x124, 0x20001]          # qcom,msm-id of dt/msm8998-google-walleye.dts
dtb = "qcom/msm8998-google-walleye.dtb"   # appended to the kernel
kernel_compression = "gzip"
ramdisk_compression = "xz"
avb_footer = true
device_wait = 170                   # seconds to wait for a test image's device nodes after its shell answers (attended tries)
back_wait = 240                     # seconds to wait for the phone to be back on Android after a try

# The USB gadget our init raises, declared for `lpoco-bringup initramfs init` (item walleye-init-from-roof): the names are the ones every
# init of ours already sets (check-init-serials.sh). Declared only: no build of ours uses the generated init yet, because it still lacks
# the 180 s hold, the watchdog petter, the raw command loop and the banner (research walleye-generated-init-gaps). console is the default acm
# (configfs ACM beside ECM); rndis false: none of our images has the second configuration.
[boot.gadget]
serial = "walleye-first-boot"
product = "Pixel 2 walleye (mainline banner shell)"
label = "walleye-init"
rndis = false

# What the attended tries (procedures/*.rs, plumbing in procedures/steps) read about this phone; each fact in the table that
# owns it (decision 2026-11-19-attended-keys-in-the-manifest). Every key is read at the top of main: a missing one fails --dry-run.
[tools]
adb = "adb"
fastboot = "fastboot"

# The kernel this lab builds from an int/ tag (lab-tools README "lpoco bringup image ensure"; item walleye-declares-its-kernel-build): the
# ufs-off list as the shipped images carry it, built in Nix's sandbox with the user lpoco, the host lab, the counter 1 and the clock of the
# tag, so two builds give the same bytes. The board dts files are not inputs of this kernel (Image.gz holds no dtb): an image takes its dtb
# as a recipe part, by sha256. NOT the shipped kernels: those say "-dirty (mll@grig) ... Thu Nov 19" in their version line (research
# walleye-kernel-build-declared-reproduces-itself), so no declared hash of a shipped image can be met by a rebuild.
[kernel_builds.walleye-ufs-off]
tag = "int/walleye/ufs-off-e123d3bff/v7.3/1"
rev = "0e20c7a89ac5748fbd38f59a2b66324aad84cbbb"          # the commit the tag points at (git ls-remote ...^{})
epoch = 1795421895                                          # the tag's own time (git log -1 --format=%ct)
configs = ["5424de9b251f819ad862914593f980a799a87ac7402f1e838cf7a3167bbb7b6e"]   # build/walleye.config
patches = []
targets = ["Image.gz"]
sha256 = "88afb4d742ff59a3ad0b8f1cffa8a7709c7e99a0a926dca732cf33c5f90d97ac"

# The kernel of the UFS-off list with the SLPI start built in (item walleye-slpi-image-kernel-pas): the tag int/walleye/ufs-off/v7.3/1 (the pmic-wdt topic at its tip 8b2283da, as the list holds it today)
# built with build/walleye.config as it is now (QCOM_Q6V5_PAS, QCOM_SYSMON, RPMSG_QCOM_GLINK_SMEM =y beside QRTR and PD_MAPPER); the config is the only change from the shipped list, so no new tag. Image.gz holds no dtb.
[kernel_builds.walleye-ufs-off-slpi]
tag = "int/walleye/ufs-off/v7.3/1"
rev = "41f3b5fd66bbbdeeb98f75ea1180652834b4147c"          # the commit the tag points at (git rev-parse TAG^{commit})
epoch = 1795421017                                          # the tagged commit's committer time (git log -1 --format=%ct TAG)
configs = ["695954ce34021b736e8b3b6231fb35953e7d6c5badf191313fa45faed1a164f3"]   # build/walleye.config
patches = []
targets = ["Image.gz"]
sha256 = "cc051a6e30369c0867245af7a1811e0059ebf6832ee2a2c1cba0bb8f823c16b7"

# The kernel of the UFS-on list, built from its int/ tag (item walleye-declares-ufs-on-kernel-build): the tag the production image was built from, rebuilt in Nix's sandbox; NOT byte-equal to the shipped image (built by hand; its config predates 3e5694a, QCOM_PD_MAPPER=y).
# The fragments are the ones build/build-ufs-root-production.sh merged after walleye.config (retired by walleye-retire-build-scripts): walleye, diag, ufs-root, by sha256.
# The tag holds the pmic-wdt topic, the fuel-gauge RFC and ufs-match-android (kernel/topics.toml, list ufs-on). The dtbs are recipe parts by sha256 (Image.gz holds none).
[kernel_builds.walleye-ufs-on]
tag = "int/walleye/ufs-on/v7.3/1"
rev = "5caddde2d6f98e13a97b5cf087dbd2a1e3b879b0"          # the commit the tag points at (git ls-remote ...^{})
epoch = 1795421025                                          # the tagged commit's committer time (git log -1 --format=%ct TAG)
configs = ["afcb3fe254d2f590076d0aa640e926aa51eef4ec380a6592914321079f7e6611", "10a6010a1373146e7de7c1deb69af75aa8d58a1d8e75feeaf068edb975b575e8", "dd75a73094ebe361c9b9a9ee8705137f1679d7c3be2680e8fd6eec59753a33b7"]   # build/walleye.config, walleye-diag.config, walleye-ufs-root.config
patches = []
targets = ["Image.gz"]
sha256 = "f132e0f2a857f200e1edd70a70bb123caa79c3275c5a5fa634a33e8d4e530baa"

# The kernel of the four PMIC bites (item walleye-wdt2-images-from-tag): the tag int/walleye/ufs-off-wdt2/v7.3/1 (the watchdog topic and, on it, the S2 reset type from qcom,s2-type; UFS off), built with build/walleye.config
# and build/walleye-wdt.config (CONFIG_DYNAMIC_DEBUG, so the command line's dyndbg shows the driver's lines), in Nix's sandbox as the kernels above. Image.gz holds no dtb: the wdt2 images take theirs as a recipe part.
[kernel_builds.walleye-wdt2]
tag = "int/walleye/ufs-off-wdt2/v7.3/1"
rev = "ea5b65b121907e9c292f1c536e4753cac3591599"          # the commit the tag points at (git rev-parse TAG^{commit})
epoch = 1795746342                                          # the tagged commit's committer time (git log -1 --format=%ct TAG)
configs = ["695954ce34021b736e8b3b6231fb35953e7d6c5badf191313fa45faed1a164f3", "ba86b52ad7a4988d386a6eee045492283d35c4f0fc07af2f2b6ef03cb7b2474b"]   # build/walleye.config, build/walleye-wdt.config
patches = []
targets = ["Image.gz"]
sha256 = "8d00ca7e86378418c2f9ac5beff37a927f3571504d95ecab0e436707d9420fe7"

# The kernel of the modem image (item walleye-modem-mss-image): the tag int/walleye/ufs-off-modem/v7.3/1 (the list ufs-off-modem: the watchdog topic and the PMI8998 fuel gauge RFC; UFS off), built with build/walleye.config
# and build/walleye-modem.config (QCOM_Q6V5_MSS and QCOM_RMTFS_MEM =y), in Nix's sandbox as the kernels above. Image.gz holds no dtb: the modem image's dtb is dt/msm8998-google-walleye-modem.dts built on this tag's tree.
[kernel_builds.walleye-ufs-off-modem]
tag = "int/walleye/ufs-off-modem/v7.3/1"
rev = "78cfb5a6b6170ad9731344e2b8208ed811d78677"          # the commit the tag points at (git rev-parse TAG^{commit})
epoch = 1795753563                                          # the tagged commit's committer time (git log -1 --format=%ct TAG)
configs = ["695954ce34021b736e8b3b6231fb35953e7d6c5badf191313fa45faed1a164f3", "7a80900e8e9aa7379157870a8e7ff0b4deff9729925861baa96a953ee45385b6"]   # build/walleye.config, build/walleye-modem.config (QCOM_IPA=y added; was f4cb7cca)
patches = []
targets = ["Image.gz"]
sha256 = "0347728b82e416fbdc4c90c7ef7abef3ad3216366fb45cd207560a7e4b7aa1ad"   # the tag int/walleye/ufs-off-modem/v7.3/1 with CONFIG_QCOM_IPA=y (was 3651b543 without it)

# The kernels the attended procedures' boot_once and back_to_known_good name. Walleye boots only by fastboot boot and nothing is written to it: "kept" names the image the way back returns to, not a kernel stored on the phone.
[kernels]
test = ["z21", "nfc", "l7", "b2", "b-d5", "b-d15", "b-d25", "b-d35", "b-d50", "b-s5", "b-r5", "b-r2", "b-rp2", "b-q5", "wdt1-a", "wdt1-b", "pon-read"]   # b-*: the delay bisect's images (its image_prefix)
boot = "fastboot"                   # a test image is booted from memory (its [images.NAME]), nothing written: boot_once and phone_ready read this
kept = "z21"
# How the phone comes back to Android after a try (lpoco-attended 0.46.3 runs each line in this folder, as argv, in order, then waits for `back_on` to answer; a test image has no systemd, so the library's `systemctl reboot` does not fit):
# the lab's own way back, procedures/way-back-on-the-pixel-2.rs: Android already, nothing sent; the bootloader, `fastboot reboot`; a test image's shell, `reboot -f` then the sysrq reboot. bin/attended is the runner the steps crate is locked to.
way_back = ["bin/attended run way-back-on-the-pixel-2"]
back_on = "android"

# The images the tries boot, named; `dir` is a folder of this lab (a link to ~/Projects/walleye-build, which stays out of git), each
# path below it. The checksum is the one SHA256SUMS beside the image records. wdt1-a and wdt1-b are the rebuilt pair
# (images-wdt1-sysfsless: the sysfs-less reader fix in the ramdisk init); the older images-wdt1 pair is no longer tried.
[images]
dir = "build/images"

[images.z21]
path = "images-z21/boot-z21.img"
kernel_tag = "int/walleye/ufs-off-e123d3bff/v7.3/1"
sha256 = "bdc0a89179d2d7fdb75e729515fcaadb9a501d4c6fdb835dc1fc3cff4639c7ff"

# z21 rebuilt from z20 and its own dtb; its script build-z21.sh is retired (2026-11-26) (decision 2026-11-23-image-recipes-on-nix-fixed-output-paths): `lpoco bringup image ensure z21`
# equals the sha256 above. Sources: z20's sha256 is walleye-build/images-z20/SHA256SUMS-z20; the dtb's is walleye-build/images-z21/SHA256SUMS-z21;
# kernel, ramdisk, header and command line are z20's.
[images.z21.recipe]
control = "z20"
dtb = "f9f2ca5d511f3a5cacc40fb7385bc1e84d96c396f634c065da9847c4ce708260"

# The SLPI image (item walleye-slpi-image-kernel-pas): UFS OFF, starts remoteproc_slpi from the phone's own firmware. z21 with three parts swapped: the kernel of [kernel_builds.walleye-ufs-off-slpi]
# (PAS driver, sysmon, glink-smem =y), the dtb built from dt/ on that tag's tree plus the fuel gauge RFC commits' dtsi (build-kernel.sh's way; slpi_mem 15 MiB at the running base, remoteproc_slpi okay;
# tests/host/dtb-slpi-carveout.sh passes) and the ramdisk of build/initramfs-slpi (z21's init and busybox, the SLPI firmware slpi_v2.mdt and .b00-.b14 under /lib/firmware/qcom/msm8998/google/walleye).
# The firmware is the phone's own, read from vendor_a (research walleye-slpi-carveout-read) and kept outside git; the ramdisk part enters the store from the seed. Header, size and AVB footer are z21's.
# Since item walleye-slpi-boot-procedure the ramdisk also holds /bin/qrtr-lookup (static aarch64, tests/host/qrtr-lookup.sh), so a service list can be read.
[images.slpi]
path = "images-slpi/boot-slpi.img"
kernel_tag = "int/walleye/ufs-off/v7.3/1"
sha256 = "b98194279d75f0fd98aeb419d307838693843f8a0abfcf8479930316c74365b2"

[images.slpi.recipe]
control = "z21"
kernel = "cc051a6e30369c0867245af7a1811e0059ebf6832ee2a2c1cba0bb8f823c16b7"
dtb = "782de8ee84dd18bfb45b51054c3aa6f277ee29df9d78fe7761628e6d5adb851f"
ramdisk = "59d0cb601bab4ffa4b97ffb038e4e10408085dcdb1e4fce920253ae964ecc32c"
cmdline = "clk_ignore_unused ignore_loglevel panic=5 androidboot.hardware=walleye androidboot.console=ttyMSM0 androidboot.dtbo_idx=3"

# The NFC test image (item walleye-nfc-dts-node-image): the slpi image's kernel line (the list ufs-off, tag int/walleye/ufs-off/v7.3/1, UFS OFF) with NFC built in (build/walleye-nfc.config:
# RFKILL, NFC, NFC_NCI, NFC_NXP_NCI, NFC_NXP_NCI_I2C =y, merged after walleye.config), the dtb of dt/ with the nfc@28 node on blsp2_i2c2 (c1b6000) and the ramdisk of `build/build-initramfs.sh phone`: the roof's init
# (lpoco bringup initramfs init, gadget serial walleye-first-boot, net 43 as device.toml says: rebuilt 2026-11-26, decision 2026-11-26-walleye-ramdisk-on-net-43), so one boot proves the NFC node and walleye-init-from-roof. Header, size and AVB footer are slpi's. The kernel and the dtb
# are hand-built (build-kernel.sh on a worktree of the tag; sha256 in ~/Projects/walleye-build/images-nfc/SHA256SUMS-nfc), not a [kernel_builds] row: they enter the store from the seed once.
# The ramdisk holds /bin/walleye-nfc-up since 2026-11-26 (item walleye-nfc-nfc0-opener-in-ramdisk: ramdisk 973bcb87, image 65cef2f5; [images.walleye-nfc-up]). The node is in the OnePlus 5's form since 2026-11-26 (enable on gpio116, pull-ups on 12, 116 and 92; research walleye-nfc-oneplus5-image-built): dtb 86550c1e (the image before the opener: bb881ba1). NOT KNOWN YET: the controller's clock (Android: BBCLK3, pm8998 gpio21 clkreq), the pins' drive strength. The roof's init lacks the 180 s hold, the watchdog petter and the banner
# (research walleye-generated-init-gaps): read that before the try is queued. Host checks: tests/host/ufs-off-image.sh passes; the overlay merge leaves the node (the vendor's nq@28 lands in the stub i2c_8).
[images.nfc]
path = "images-nfc/boot-nfc.img"
kernel_tag = "int/walleye/ufs-off/v7.3/1"
sha256 = "019b0dcee641b77b7e673ddc1a52c6fa4dab04b19f4e284afd4cf64c6c6bd1c4"

[images.nfc.recipe]
control = "slpi"
kernel = "78dbbff60f21ad372947d05c7c375632bb79a4dc2aeac1da4142f170ca117607"
dtb = "86550c1e194000fcf89538951b30832d5cede49293d39a7385d99e6c3fea805c"
ramdisk = "f4b6c1d750e15cc180c76bd031489830b2fa256dc47969f253c81b5681e2d02b"

# The modem image (item walleye-modem-mss-image): UFS OFF; remoteproc_mss okay on the phone's own firmware names; nothing starts at boot. The slpi image's header, size (32 MiB) and AVB footer, with the kernel of [kernel_builds.walleye-ufs-off-modem],
# the dtb of dt/msm8998-google-walleye-modem.dts (clock_gcc named real, as every image since z3) and the ramdisk of build/build-modem-ramdisk.sh: the slpi init and busybox, static rmtfs, qrtr-ns, qrtr-lookup, tqftpserv and qmicli (build/modem-tools.nix),
# /bin/modem-up and /bin/firmware-recv, and the phone's own modemst1, modemst2, fsg and fsc reads as /rmtfs/modem_fs1, _fs2, _fsg, _fsc (mode 444; rmtfs runs with -r). The modem firmware (61 MB) is NOT in it - with the kernel it does not fit the 32 MiB
# boot partition (decision 2026-11-27-walleye-modem-firmware-is-pushed-not-packed): the host pushes build's modem-firmware.tar over the USB network (firmware-recv, then modem-up). PRIVACY: the ramdisk holds the modem's storage partitions, so the
# image has no [recipe] and never enters the Nix store or the binary cache; it lives in ~/Projects/walleye-build/images-modem (mode 700), the firmware tar beside it. NOT KNOWN YET: that the modem boots, where rmtfs's block belongs on this phone.
[images.modem]
path = "images-modem/boot-modem.img"
kernel_tag = "int/walleye/ufs-off-modem/v7.3/1"
