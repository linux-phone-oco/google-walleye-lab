modules = 13                    # the display modules the init must say ok for
identity = "~/lab-material/walleye/walleye-lab-ed25519"   # the lab-only ssh key (mode 600; its public half is root's authorized_keys in the image's userland)
ssh_user = "root"
ssh_port = 22

