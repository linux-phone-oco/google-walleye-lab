# The STAGE 2 boot image (item walleye-install-stage2-boot-image, 2026-11-23): the ufs-root image above rebuilt by build/build-ufs-root-image.sh with BOOTED_SLOT=yes and ROOT_PART=system_a (Android is on slot b, so
# the flashed slot is a), built twice with this one sha256, 28 checks ok. It differs from c3373d71 (which stays as stage 1 history and as the RAM boot of [images.ufs-root]) in two things only: the ramdisk (the init of
# PR 765: it takes the word walleye.booted-slot, says `walleye-init: mounts-the-booted-slot` and mounts exactly the system of the slot it is booted from) and the command line (+ walleye.booted-slot). Kernel Image.gz, dtb,
# header and AVB footer as c3373d71. NOT to boot or flash except by procedures/install-boot-on-the-pixel-2.rs under the coordinator's go on walleye-install-flash-boot-run naming THIS sha256; tests/host/ufs-off-image.sh
# refuses it by design. Never booted.
[images.ufs-root-booted-slot]
path = "NOT-TO-BOOT-ufs-on-images-ufs-root-booted-slot/NOT-TO-BOOT-ufs-on-ufs-root-booted-slot.img"
kernel_tag = "int/walleye/ufs-on-3644090c7/v7.3/1"
sha256 = "e337de53446aa98e4795e214648427e22b467b3ab39f2d208e201951ff4098f1"

# The read-only UFS-on boot of that image as ONE command (item walleye-install-boot-procedure; run by item walleye-install-rootfs-boots-try). The root is the system partition of the slot Android is NOT on, read at the run
# (adb's ro.boot.slot_suffix equal to fastboot's current-slot, and equal to the root the image names); nothing here names a slot.
# The image booted is THIS run's: the declared one with androidboot.slot_suffix=_<the slot read> on its command line (lpoco-bringup image swap, checked equal in every other byte); the declared sha256 above stays the one the go names.
[procedures.rootfs-boots-on-the-pixel-2]
go_item = "walleye-install-rootfs-boots-try"   # the item whose go_until holds the author's go AND whose row names the image's sha256: the boot runs only while the go is in the future
identity = "~/lab-material/walleye/walleye-lab-ed25519"   # the lab-only ssh key (mode 600; its public half is root's authorized_keys in [images.alpine-rootfs]); the login is by this key alone
ssh_user = "root"
ssh_port = 22
bootchain = "~/lab-material/walleye/bootchain-2026-11-19"   # the stored boot chain read-back: the boot chain read again after the boot must equal it (tests/host/bootchain-readback-check.sh STORED NEW)
by_name = "/dev/block/by-name"                              # the phone's partition names on Android: the root partition is hashed by name before and after
luns = 6                                                    # the card's disks (sda to sdf): the partition table of each is hashed before and after

# The rehearsal of that boot (procedures/rehearse-rootfs-boots-on-the-pixel-2.rs; item walleye-rootfs-boots-rehearsal): every step but the boot, the card read from Android, the guard, the slots' flags, the boot chain read back.
# It boots nothing and needs no go (go_item is read into the settings and never asked); the keys are the boot's, read from this table, so a key renamed there fails in both.
[procedures.rehearse-rootfs-boots-on-the-pixel-2]
go_item = "walleye-install-rootfs-boots-try"
identity = "~/lab-material/walleye/walleye-lab-ed25519"
ssh_user = "root"
ssh_port = 22
bootchain = "~/lab-material/walleye/bootchain-2026-11-19"
by_name = "/dev/block/by-name"
luns = 6

# The Alpine login prompt on the glass (item walleye-display-alpine-ramroot-image; procedures/alpine-login-on-the-glass-on-the-pixel-2.rs): image B-a5, B-r5's kernel, dtb and 13 display modules with the
# Alpine userland unpacked into a tmpfs root (UFS off), booted once from memory; ssh over usb-network by the lab key; then the author's look. Run unattended by the keeper it stops at the look; the way back runs after.
[procedures.alpine-login-on-the-glass-on-the-pixel-2]
image = "b-a5"                  # the name of its [images.NAME] (path, sha256)
delay = 5                       # seconds of uptime at which the init loads the display modules (B-r5's own)
modules = 13                    # the display modules the init must say ok for
identity = "~/lab-material/walleye/walleye-lab-ed25519"   # the lab-only ssh key (mode 600; its public half is root's authorized_keys in the image's userland)
ssh_user = "root"
ssh_port = 22

# The any-order images (item walleye-display-dts-any-order; build/build-display-any-order-images.sh): B-r5's kernel, command line, header words, size and modules, on a dtb built from the kernel tree with kernel/display-mdss-reset
# (the mdss reset as the kernel's own msm8998.dtsi has it; the lab levers the display dtbs carry are added as before) and the modules loaded at 2 s of uptime. B-r2 keeps B-r5's module order; B-rp2 loads the panel module BEFORE msm.
# Run with delays = "2" and image_prefix = "b-r" (B-r2) or "b-rp" (B-rp2), as the delay bisect runs B-r5.
[images.b-r2]
path = "images-display-any-order/boot-b-r2.img"
sha256 = "c05ae4ec273b8c1245eb5c98197832a8c2fe9b6282e486ac706a4b5ca8ac779b"

[images.b-rp2]
path = "images-display-any-order/boot-b-rp2.img"
sha256 = "29fce8b7a9720302583d42d52f5756756ff38a2d66280f4546280b9541301ce6"

# Install stage 2 as ONE command (item walleye-install-flash-boot-procedure; decision 2026-11-22-walleye-author-research-then-proceed): our boot image flashed to boot_<the slot Android is NOT on>, read back, made
# active by the bootloader's own set_active, the new slot observed, the way back set_active <Android's slot>. The image is named by its [images.NAME] row (never a typed sha256: the ufs-root image is rebuilt by other items), the
# slot is read by adb AND fastboot at the run. NOT to run except by a keeper under the coordinator's go on go_item, after the stage 1 proof and UFS try 2.
[procedures.install-boot-on-the-pixel-2]
image = "ufs-root-booted-slot"                  # the name of its [images.NAME] (path, sha256): the stage 1 kernel with the stage 2 init and the word walleye.booted-slot
go_item = "walleye-install-flash-boot-run"           # the item whose go_until holds the coordinator's go AND whose row names the image's sha256
identity = "~/lab-material/walleye/walleye-lab-ed25519"   # the lab-only ssh key (mode 600): the login to the new slot is by this key alone
ssh_user = "root"
ssh_port = 22
bootchain = "~/lab-material/walleye/bootchain-2026-11-19"   # the stored boot chain read-back: read again at the end it must equal it (no bootloader partition changed)
backup = "~/lab-material/walleye/slot-readback-2026-11-20-2"   # the slots' read-back: the boot partition to be flashed, read now, must be its backup (the flash can be undone)
by_name = "/dev/block/by-name"                       # the phone's partition names on Android
luns = 6                                             # the card's disks (sda to sdf): the GPT of each is read whole before and after
flash_allow = "boot_a boot_b"                        # the only names a flash may take; the run picks the one that is not the slot Android runs from
to_bootloader = "reboot bootloader"                  # what the lab runs over ssh on the new slot to restart into the bootloader for the way back: whether OUR kernel does that is not known yet (a hand step is said when it does not)

# The rehearsal of that command (procedures/rehearse-install-boot-on-the-pixel-2.rs): every step but the flash, the set_active, the new slot's boot and the switch back; nothing is written and no go is needed.
[procedures.rehearse-install-boot-on-the-pixel-2]
image = "ufs-root-booted-slot"
go_item = "walleye-install-flash-boot-run"
identity = "~/lab-material/walleye/walleye-lab-ed25519"
ssh_user = "root"
ssh_port = 22
bootchain = "~/lab-material/walleye/bootchain-2026-11-19"
backup = "~/lab-material/walleye/slot-readback-2026-11-20-2"
by_name = "/dev/block/by-name"
luns = 6
flash_allow = "boot_a boot_b"
to_bootloader = "reboot bootloader"
