# The modem boot (procedures/modem-boot-on-the-pixel-2.rs; item walleye-modem-firmware-push-procedure; decision 2026-11-27-walleye-modem-firmware-is-pushed-not-packed): the modem image `image` names ([images.modem]) is booted once
# from memory (UFS off by the gate, nothing flashed, no slot changed); over its USB network the firmware tar of the procedure table is pushed (firmware-recv, port 9000), modem-up runs and the remoteproc states, the kernel's modem lines,
# the daemons' logs and qrtr-lookup's list are read inside the init's 180 s. No go and no ssh key. The card's tables, the boot chain and the slots' flags are read before and after and must be equal.
