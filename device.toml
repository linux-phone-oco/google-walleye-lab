sha256 = "d678b2d5a07dbc5796091e868d8c3fbd55d959f387912e83a96fa84b5f573e72"

[images.b-d25]
path = "images-display-delay/boot-b-d25.img"
sha256 = "76976e0bb88ef0ad46f4639fc11de5f71e872480fa65c331d7a5da83ccc6f445"

[images.b-d35]
path = "images-display-delay/boot-b-d35.img"
