rootfs = "images-modem/modem-mm-rootfs.tar"                   # the ModemManager rootfs tar, pushed second (port 9001); build/modem-mm-rootfs.nix builds it
rootfs_sha256 = "5484b5704d21b8774025ad872404ce27af3c1081d42d58c724a7a221c499dd20"   # build/modem-mm-rootfs.sha256
bootchain = "~/lab-material/walleye/bootchain-2026-11-19"   # the stored boot chain read-back: read again at the end it must equal it
by_name = "/dev/block/by-name"                              # the phone's partition names on Android
luns = 6                                                    # the card's disks (sda to sdf): the partition table of each is hashed before and after

# The rehearsal of the modem boot (procedures/rehearse-modem-boot-on-the-pixel-2.rs): every step but the boot, the push and the read; nothing booted. The keys are the boot's.
[procedures.rehearse-modem-boot-on-the-pixel-2]
