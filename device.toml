# Install stage 2 as ONE command (item walleye-install-flash-boot-procedure; decision 2026-11-22-walleye-author-research-then-proceed): our boot image flashed to boot_<the slot Android is NOT on>, read back, made
# active by the bootloader's own set_active, the new slot observed, the way back set_active <Android's slot>. The image is named by its [images.NAME] row (never a typed sha256: the ufs-root image is rebuilt by other items), the
# slot is read by adb AND fastboot at the run. NOT to run except by a keeper under the coordinator's go on go_item, after the stage 1 proof and UFS try 2.
[procedures.install-boot-on-the-pixel-2]
image = "ufs-root-booted-slot-production"       # the name of its [images.NAME] (path, sha256): THE STAGE 2 PRODUCTION IMAGE (2026-11-23, item walleye-stage2-production-image; was the debug image a0a55cd0, run 11 passed with it) - THE STAGE 2 DEBUG IMAGE (2026-11-23, item walleye-stage2-debug-image; was "ufs-root-booted-slot", e337de53, whose run 7 left no trace); this one line is what the run declares - the go on walleye-install-flash-boot-run names the new sha256
go_item = "walleye-install-flash-boot-run"           # the item whose go_until holds the coordinator's go AND whose row names the image's sha256
identity = "~/lab-material/walleye/walleye-lab-ed25519"   # the lab-only ssh key (mode 600): the login to the new slot is by this key alone
ssh_user = "root"
ssh_port = 22
bootchain = "~/lab-material/walleye/bootchain-2026-11-19"   # the stored boot chain read-back: read again at the end it must equal it (no bootloader partition changed)
backup = "~/lab-material/walleye/slot-readback-2026-11-20-2"   # the slots' read-back: the boot partition to be flashed, read now, the backup file must be on file and hash to its record (the flash can be undone); what the partition holds now is recorded, not asserted
by_name = "/dev/block/by-name"                       # the phone's partition names on Android
luns = 6                                             # the card's disks (sda to sdf): the GPT of each is read whole before and after
flash_allow = "boot_a boot_b"                        # the only names a flash may take; the run picks the one that is not the slot Android runs from
to_bootloader = "/tmp/walleye-reboot --command bootloader"   # what the lab runs over ssh on the new slot after pushing [images.walleye-reboot] to /tmp (the same tool and function as stage 1's way back; busybox's `reboot bootloader` drops the argument): whether OUR kernel reaches the bootloader with it is measured by the run (a hand step is said when it does not)
fallback_wait = 420                                   # seconds to wait, sending the phone NOTHING, for Android to answer adb after the new slot gave no ssh (the bootloader fell back in about 3 to 4 minutes in run 4, research walleye-stage2-run4-stops-at-step-21-no-ssh-from-slot-a: the bound is 7 minutes); the pstore is read the moment adb answers
usb_log_match = "3-2"                                  # the words that pick the phone's lines out of the lab host's kernel log (journalctl -k): every run keeps them from the set_active on, in host-usb-log.txt and failed-boot-read.txt (run 7: no gadget of ours in 67 s)

# The rehearsal of that command (procedures/rehearse-install-boot-on-the-pixel-2.rs): every step but the flash, the set_active, the new slot's boot and the switch back; nothing is written and no go is needed.
[procedures.rehearse-install-boot-on-the-pixel-2]
image = "ufs-root-booted-slot-production"   # the same one name as the command's (the rehearsal checks the image the run declares)
go_item = "walleye-install-flash-boot-run"
identity = "~/lab-material/walleye/walleye-lab-ed25519"
ssh_user = "root"
ssh_port = 22
bootchain = "~/lab-material/walleye/bootchain-2026-11-19"
backup = "~/lab-material/walleye/slot-readback-2026-11-20-2"
by_name = "/dev/block/by-name"
luns = 6
flash_allow = "boot_a boot_b"
to_bootloader = "/tmp/walleye-reboot --command bootloader"
fallback_wait = 420
usb_log_match = "3-2"

# The way back's reboot tool (item walleye-reboot-reason-restart2-tool): tools/walleye-reboot built static for aarch64 by build/build-reboot-bin.sh (reproducible: two builds, the same bytes), kept in the images folder.
# The stage 1 way back checks this sha256, pushes the file over ssh into the phone's /tmp (the overlay's tmpfs: nothing touches the card) and runs it with `--command bootloader`: reboot(2) RESTART2, which busybox's `reboot bootloader` never sends.
