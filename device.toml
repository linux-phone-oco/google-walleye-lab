# The Alpine-in-RAM image B-a5 (item walleye-display-alpine-ramroot-image; rebuilt by item walleye-display-alpine-getty-on-the-glass with the getty on tty1, then the prompt last and the console quiet: [images.alpine-rootfs-v5]): B-r5's kernel, dtb (mdss reset), command line, header words, size and 13 display modules as they are; its ramdisk adds the userland of
# [images.alpine-rootfs-v3] (v2 with the glass getty on tty1 instead of tty0, read out of it by tools/walleye-ramroot) as /userland.tar, which build/initramfs-ramroot/init unpacks into a tmpfs after the modules load at 5 s, then switch_root to
# Alpine's /sbin/init: OpenRC, getty on tty1 (the glass) and ttyGS0, sshd over the usb gadget network. UFS is OFF (the gate passes it): nothing of the card is touched. Built twice with this one sha256 and checked by
# `walleye-ramroot --build now`; booted from memory only by procedures/alpine-login-on-the-glass-on-the-pixel-2.rs.
[images.b-a5]
