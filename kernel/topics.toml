# The Pixel 2's test kernels: lists for `rhizoid assemble` (decision 2026-11-23-structure-kernel-topics-and-integration).
# Each list is a base and topic branches of linux-phone-oco/linux, merged in this order into a tag int/walleye/LIST/BASE/N.
# Two lists, two tags: never one tag for both.

name = "walleye"
tag = "int/{name}/{list}/{base}/{n}"
branches = ["topic/ITEM", "backport/ITEM/BASE", "archive/ITEM"]

# The kernel with the UFS storage off: the image's root is on the SD card or USB.
[lists.ufs-off]
base = "v7.3"

[[lists.ufs-off.entries]]
branch = "topic/pmic-wdt-wake-in-suspend"
for = "the PMIC watchdog that keeps running through suspend"
state = "trying"

# The kernel with the UFS storage on, matched to the Android kernel's setup.
[lists.ufs-on]
base = "v7.3"

[[lists.ufs-on.entries]]
branch = "topic/pmic-wdt-wake-in-suspend"
for = "the PMIC watchdog that keeps running through suspend"
state = "trying"

[[lists.ufs-on.entries]]
branch = "topic/walleye-fuel-gauge-rfc"
for = "the PMI8998 fuel gauge (carried: others' patches)"
state = "trying"

[[lists.ufs-on.entries]]
branch = "topic/ufs-match-android"
for = "UFS storage on the Pixel 2: reset pin, PHY tables, the card's one quirk, the purge guard"
state = "trying"

# FROZEN lists: what the shipped images were built from (decision 2026-11-23-walleye-frozen-lists-reproduce-shipped-images).
# They pin the watchdog topic at e123d3bff on an archive ref; the live lists above take the topic's tip and build the NEXT images.
[lists.ufs-off-e123d3bff]
base = "v7.3"

[[lists.ufs-off-e123d3bff.entries]]
branch = "archive/pmic-wdt-e123d3bff"
for = "the PMIC watchdog as the shipped ufs-off images carry it (e123d3bff, before the two fixes)"
state = "trying"

[lists.ufs-on-3644090c7]
base = "v7.3"

[[lists.ufs-on-3644090c7.entries]]
branch = "archive/pmic-wdt-e123d3bff"
for = "the PMIC watchdog as the shipped ufs-on image carries it (e123d3bff, before the two fixes)"
state = "trying"

[[lists.ufs-on-3644090c7.entries]]
branch = "topic/walleye-fuel-gauge-rfc"
for = "the PMI8998 fuel gauge (carried: others' patches)"
state = "trying"

[[lists.ufs-on-3644090c7.entries]]
branch = "topic/ufs-match-android"
for = "UFS storage on the Pixel 2: reset pin, PHY tables, the card's one quirk, the purge guard"
state = "trying"

# The kernel of the four PMIC bites (item walleye-wdt2-images-from-tag): the watchdog topic and, on it, the S2 reset type from the property qcom,s2-type (decision 2026-11-27-s2-type-topic-restacked-on-the-wake-topic). UFS off.
[lists.ufs-off-wdt2]
base = "v7.3"

[[lists.ufs-off-wdt2.entries]]
branch = "topic/pmic-wdt-wake-in-suspend"
for = "the PMIC watchdog that keeps running through suspend"
state = "trying"

[[lists.ufs-off-wdt2.entries]]
branch = "topic/pmic-wdt-s2-type"
for = "the S2 reset type from qcom,s2-type (1 warm, 4 shutdown, 7 hard; hard when absent)"
state = "trying"

# The kernel of the modem image (item walleye-modem-mss-image): the watchdog topic and, on it, the PMI8998 fuel gauge (our board dts enables pmi8998_fg, so a tree without it does not build the dtb); UFS stays off.
[lists.ufs-off-modem]
base = "v7.3"

[[lists.ufs-off-modem.entries]]
branch = "topic/pmic-wdt-wake-in-suspend"
for = "the PMIC watchdog that keeps running through suspend"
state = "trying"

[[lists.ufs-off-modem.entries]]
branch = "topic/walleye-fuel-gauge-rfc"
for = "the PMI8998 fuel gauge (carried: others' patches)"
state = "trying"

# The kernel of the SMMU-on display try with the identity client (item walleye-display-identity-client-list-image; decision 2026-11-28-walleye-display-identity-client-list-first): the tree the display images' kernel was built from (the watchdog archive at e123d3bff and the fuel gauge RFC: v7.3 + 7 commits, 7430c717a94c, build-display-late.sh's tree), and on it the one line adding qcom,msm8998-mdss to arm-smmu-qcom's identity clients. UFS off.
[lists.display-smmu-id]
base = "v7.3"

[[lists.display-smmu-id.entries]]
branch = "archive/pmic-wdt-e123d3bff"
for = "the PMIC watchdog as the display images' kernel carries it (e123d3bff)"
state = "trying"

[[lists.display-smmu-id.entries]]
branch = "topic/walleye-fuel-gauge-rfc"
for = "the PMI8998 fuel gauge (carried: others' patches; the board dts enables pmi8998_fg)"
state = "trying"

[[lists.display-smmu-id.entries]]
branch = "topic/iommu-arm-smmu-qcom-msm8998-mdss-identity"
for = "qcom,msm8998-mdss on arm-smmu-qcom's identity clients: the display's default domain does not translate while the bootloader scan-out is live"
state = "trying"
